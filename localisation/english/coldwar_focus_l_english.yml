l_english:
 # Soviet tree
 SOV_coldwar_root: "The Dawn of the Cold War"
 SOV_coldwar_root_desc: "The Second World War is over. A new, colder conflict begins between the Soviet Union and the Western powers."
 SOV_warsaw_pact: "Form the Warsaw Pact"
 SOV_warsaw_pact_desc: "Bind the socialist states of Eastern Europe into a formal military alliance under Soviet leadership."
 SOV_support_dprk: "Support the DPRK"
 SOV_support_dprk_desc: "Back Kim Il-sung's government in North Korea with arms and advisors."
 SOV_support_east_germany: "Support the German Democratic Republic"
 SOV_support_east_germany_desc: "Strengthen the socialist state in eastern Germany."
 SOV_berlin_blockade: "The Berlin Blockade"
 SOV_berlin_blockade_desc: "Cut off Western access to Berlin and test the resolve of the Allies."
 SOV_support_vietnam: "Support the Viet Minh"
 SOV_support_vietnam_desc: "Provide material support to communist forces in Indochina."
 SOV_afghan_intervention: "Intervene in Afghanistan"
 SOV_afghan_intervention_desc: "Send the Red Army into Afghanistan to prop up the socialist government in Kabul."
 SOV_five_year_plan: "A New Five-Year Plan"
 SOV_five_year_plan_desc: "Launch another ambitious plan to modernize Soviet industry."
 SOV_heavy_industry: "Prioritize Heavy Industry"
 SOV_heavy_industry_desc: "Pour resources into steel, coal and machinery production."
 SOV_collectivization_ii: "Complete Collectivization"
 SOV_collectivization_ii_desc: "Finish the collectivization of Soviet agriculture."
 SOV_cuban_alliance: "Embrace Revolutionary Cuba"
 SOV_cuban_alliance_desc: "Forge close ties with Castro's Cuba, just off the coast of the United States."
 SOV_destalinization: "De-Stalinization"
 SOV_destalinization_desc: "Denounce the excesses of the Stalin era and reform the Party."
 SOV_detente: "Pursue Detente"
 SOV_detente_desc: "Seek a period of relaxed tensions with the West."
 SOV_nuclear_program: "The Soviet Nuclear Program"
 SOV_nuclear_program_desc: "Race to catch up with American nuclear capability."
 SOV_first_bomb: "First Soviet Atomic Bomb"
 SOV_first_bomb_desc: "Test the USSR's first nuclear weapon, ending the American atomic monopoly."
 SOV_hydrogen_bomb: "The Hydrogen Bomb"
 SOV_hydrogen_bomb_desc: "Develop a thermonuclear weapon far more powerful than the atomic bomb."
 SOV_missile_program: "Ballistic Missile Program"
 SOV_missile_program_desc: "Develop rockets capable of delivering warheads across continents."
 SOV_sputnik: "Launch Sputnik"
 SOV_sputnik_desc: "Place the first artificial satellite into orbit, shocking the world."
 SOV_space_race_gagarin: "First Man in Space"
 SOV_space_race_gagarin_desc: "Send a Soviet cosmonaut into orbit before the Americans."

 # American tree
 USA_coldwar_root: "The Dawn of the Cold War"
 USA_coldwar_root_desc: "With the Axis defeated, a new rivalry with the Soviet Union takes shape."
 USA_marshall_plan: "The Marshall Plan"
 USA_marshall_plan_desc: "Fund the reconstruction of Western Europe to keep it out of the communist orbit."
 USA_support_western_europe: "Strengthen Western Europe"
 USA_support_western_europe_desc: "Deepen economic and political ties with the democracies of Western Europe."
 USA_nato_foundation: "Found NATO"
 USA_nato_foundation_desc: "Establish a collective defense pact against Soviet expansion."
 USA_red_scare: "The Red Scare"
 USA_red_scare_desc: "Crack down on suspected communist sympathizers at home."
 USA_containment: "The Containment Policy"
 USA_containment_desc: "Adopt a strategy of containing the spread of communism worldwide."
 USA_support_south_korea: "Support South Korea"
 USA_support_south_korea_desc: "Back Syngman Rhee's government against the communist North."
 USA_korean_war: "Intervene in Korea"
 USA_korean_war_desc: "Commit American troops to the defense of South Korea."
 USA_domino_theory: "The Domino Theory"
 USA_domino_theory_desc: "Commit to preventing the fall of Southeast Asia to communism."
 USA_vietnam_war: "Intervene in Vietnam"
 USA_vietnam_war_desc: "Send American forces to support South Vietnam."
 USA_cia_covert_ops: "Expand the CIA"
 USA_cia_covert_ops_desc: "Expand covert operations against communist movements worldwide."
 USA_bay_of_pigs: "Confront Cuba"
 USA_bay_of_pigs_desc: "Attempt to undermine the Castro government just off American shores."
 USA_detente: "Pursue Detente"
 USA_detente_desc: "Seek a period of relaxed tensions with the Soviet Union."
 USA_star_wars_sdi: "Strategic Defense Initiative"
 USA_star_wars_sdi_desc: "Invest in a missile defense shield to neutralize the Soviet nuclear threat."
 USA_manhattan_legacy: "Legacy of the Manhattan Project"
 USA_manhattan_legacy_desc: "Continue American leadership in nuclear weapons research."
 USA_hydrogen_bomb: "The Hydrogen Bomb"
 USA_hydrogen_bomb_desc: "Develop a thermonuclear weapon to stay ahead of the Soviets."
 USA_icbm_program: "Intercontinental Ballistic Missiles"
 USA_icbm_program_desc: "Develop missiles capable of striking the Soviet Union directly."
 USA_apollo_program: "The Apollo Program"
 USA_apollo_program_desc: "Commit to a bold new space program aiming for the Moon."
 USA_moon_landing: "Land a Man on the Moon"
 USA_moon_landing_desc: "Achieve the greatest feat of the Space Race."
