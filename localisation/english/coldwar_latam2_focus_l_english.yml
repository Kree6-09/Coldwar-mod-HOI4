l_english:
 # Nicaragua
 NIC_coldwar_root: "The Dawn of the Cold War"
 NIC_coldwar_root_desc: "As the world realigns after the Second World War, the Somoza family tightens its grip on Nicaragua."
 NIC_somoza_dynasty: "The Somoza Dynasty"
 NIC_somoza_dynasty_desc: "Consolidate the Somoza family's hold over the presidency and the National Guard."
 NIC_national_guard_repression: "National Guard Repression"
 NIC_national_guard_repression_desc: "Use the National Guard to suppress political dissent and rural unrest."
 NIC_earthquake_corruption: "Earthquake and Corruption"
 NIC_earthquake_corruption_desc: "Reconstruction aid after the devastating Managua earthquake is diverted for personal enrichment, fueling popular anger."
 NIC_crush_the_guerrillas: "Crush the Guerrillas"
 NIC_crush_the_guerrillas_desc: "Launch an all-out military campaign against the Sandinista National Liberation Front."
 NIC_continued_repression: "Continued Repression"
 NIC_continued_repression_desc: "Maintain tight control over the country through force."
 NIC_us_support_somoza: "Secure US Support"
 NIC_us_support_somoza_desc: "Lean on Washington's backing to keep the regime afloat."
 NIC_sandinista_revolution_triumphs: "The Sandinista Revolution Triumphs"
 NIC_sandinista_revolution_triumphs_desc: "The Somoza dictatorship falls as the FSLN marches into Managua."
 NIC_national_reconstruction_junta: "Government of National Reconstruction"
 NIC_national_reconstruction_junta_desc: "Establish a new revolutionary government to rebuild the country."
 NIC_literacy_campaign: "The National Literacy Crusade"
 NIC_literacy_campaign_desc: "Launch a nationwide campaign to eliminate illiteracy."
 NIC_land_reform_nicaragua: "Agrarian Reform"
 NIC_land_reform_nicaragua_desc: "Redistribute Somoza-era estates to peasants and cooperatives."
 NIC_contra_war: "The Contra War"
 NIC_contra_war_desc: "Defend the revolution against US-backed counter-revolutionary forces operating from Honduras and Costa Rica."
 NIC_esquipulas_peace: "The Esquipulas Peace Accords"
 NIC_esquipulas_peace_desc: "Join a regional peace process to end the conflict and normalize politics."

 # Brazil
 BRA_coldwar_root: "The Dawn of the Cold War"
 BRA_coldwar_root_desc: "Post-war Brazil enters a period of populism, instability, and rising Cold War tensions."
 BRA_goulart_reforms: "Goulart's Base Reforms"
 BRA_goulart_reforms_desc: "Pursue land reform, nationalizations, and expanded suffrage."
 BRA_military_coup_1964: "The 1964 Military Coup"
 BRA_military_coup_1964_desc: "The armed forces overthrow President Goulart, installing a military government."
 BRA_institutional_act_5: "Institutional Act Number Five"
 BRA_institutional_act_5_desc: "Grant the regime sweeping powers, closing Congress and suspending civil liberties."
 BRA_press_censorship: "Press Censorship"
 BRA_press_censorship_desc: "Impose strict censorship on newspapers, radio, and television."
 BRA_operation_condor_brazil: "Join Operation Condor"
 BRA_operation_condor_brazil_desc: "Coordinate repression of leftist dissidents with other regional military regimes."
 BRA_economic_miracle: "The Brazilian Miracle"
 BRA_economic_miracle_desc: "Drive rapid industrial growth and infrastructure expansion."
 BRA_amazon_colonization: "Colonize the Amazon"
 BRA_amazon_colonization_desc: "Open the Amazon basin to roads, settlement, and resource extraction."
 BRA_nuclear_program_brazil: "An Independent Nuclear Program"
 BRA_nuclear_program_brazil_desc: "Develop nuclear technology outside of US and Soviet oversight."
 BRA_political_opening: "Political Opening (Abertura)"
 BRA_political_opening_desc: "Begin a gradual, controlled transition away from military rule."
 BRA_debt_crisis: "The Debt Crisis"
 BRA_debt_crisis_desc: "Confront spiraling foreign debt and runaway inflation."
 BRA_return_to_democracy: "Return to Democracy"
 BRA_return_to_democracy_desc: "Hand power back to a civilian government after two decades of military rule."
