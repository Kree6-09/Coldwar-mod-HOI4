 coldwar_bookmark_1945.t: "1945 - The Dawn of the Cold War"
 coldwar_bookmark_1945.d: "The Second World War has just ended. The wartime alliance between the United States and the Soviet Union is already fraying, and a new global rivalry is beginning to take shape from Berlin to Havana."
 coldwar_bookmark_1970.t: "1970 - Revolution in Latin America"
 coldwar_bookmark_1970.d: "Detente eases tensions between Washington and Moscow, even as Latin America becomes a new battlefield: Cuba exports revolution, and Chile is about to elect the first democratic Marxist president in the Americas."
 coldwar_bookmark_1980.t: "1980 - The Lost Decade"
 coldwar_bookmark_1980.d: "Military dictatorships grip much of the Southern Cone, Nicaragua has just had its own revolution, and a new wave of superpower confrontation looms on the horizon."
