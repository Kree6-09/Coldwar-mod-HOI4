l_english:
 # Cuba
 CUB_revolution_triumphs: "The Revolution Triumphs"
 CUB_revolution_triumphs_desc: "Fidel Castro's forces have overthrown Batista. A new revolutionary government takes power in Havana."
 CUB_agrarian_reform: "Agrarian Reform"
 CUB_agrarian_reform_desc: "Redistribute land from large estates to peasants and cooperatives."
 CUB_nationalize_industry: "Nationalize Industry"
 CUB_nationalize_industry_desc: "Bring foreign-owned industry and plantations under state control."
 CUB_healthcare_education_campaign: "Healthcare and Literacy Campaign"
 CUB_healthcare_education_campaign_desc: "Launch sweeping public healthcare and literacy programs."
 CUB_soviet_alignment: "Align with the Soviet Union"
 CUB_soviet_alignment_desc: "Seek economic and military support from Moscow."
 CUB_missile_crisis: "The Missile Crisis"
 CUB_missile_crisis_desc: "Soviet missiles on Cuban soil bring the world to the brink of nuclear war."
 CUB_export_revolution: "Export the Revolution"
 CUB_export_revolution_desc: "Support revolutionary movements across Latin America."
 CUB_support_sandinistas: "Support the Sandinistas"
 CUB_support_sandinistas_desc: "Aid the new revolutionary government in Nicaragua."
 CUB_bay_of_pigs_defense: "Defend Against Invasion"
 CUB_bay_of_pigs_defense_desc: "Prepare the island's defenses against a US-backed landing."
 CUB_militarize_population: "Militarize the Population"
 CUB_militarize_population_desc: "Arm and train civilian militias to defend the revolution."
 CUB_soviet_military_aid: "Soviet Military Aid"
 CUB_soviet_military_aid_desc: "Receive weapons and advisors from the Soviet Union."

 # Chile
 CHL_coldwar_root: "The Dawn of the Cold War"
 CHL_coldwar_root_desc: "As the world realigns after the Second World War, Chilean politics enters a new era of polarization."
 CHL_popular_unity_formed: "Popular Unity Coalition"
 CHL_popular_unity_formed_desc: "A coalition of socialist and leftist parties forms behind Salvador Allende."
 CHL_allende_elected: "Allende Elected President"
 CHL_allende_elected_desc: "Salvador Allende wins the presidency, becoming the first democratically elected Marxist head of state in the Americas."
 CHL_nationalize_copper: "Nationalize Copper"
 CHL_nationalize_copper_desc: "Bring Chile's vital copper mines under state ownership."
 CHL_deepen_socialism: "Deepen the Socialist Path"
 CHL_deepen_socialism_desc: "Push forward with the Popular Unity program despite mounting opposition."
 CHL_land_reform_completion: "Complete Land Reform"
 CHL_land_reform_completion_desc: "Finish the redistribution of large estates to peasants."
 CHL_socialist_consolidation: "Consolidate the Chilean Road to Socialism"
 CHL_socialist_consolidation_desc: "Stabilize the country's institutions around the Popular Unity project."
 CHL_military_coup: "Military Coup"
 CHL_military_coup_desc: "The armed forces overthrow the government, installing a military junta."
 CHL_dina_repression: "State Repression"
 CHL_dina_repression_desc: "The new regime cracks down on political opposition."
 CHL_chicago_boys_reforms: "The Chicago Boys' Reforms"
 CHL_chicago_boys_reforms_desc: "Implement sweeping free-market economic reforms."
 CHL_operation_condor_chile: "Join Operation Condor"
 CHL_operation_condor_chile_desc: "Cooperate with other regional regimes against left-wing dissidents."

 # Argentina
 ARG_coldwar_root: "The Dawn of the Cold War"
 ARG_coldwar_root_desc: "Post-war Argentina faces deep political divisions that will define its Cold War era."
 ARG_peronist_legacy: "The Peronist Legacy"
 ARG_peronist_legacy_desc: "Navigate the lasting influence of Peronism on Argentine politics."
 ARG_political_instability: "Political Instability"
 ARG_political_instability_desc: "A cycle of coups and weak civilian governments destabilizes the country."
 ARG_proceso_coup: "The National Reorganization Process"
 ARG_proceso_coup_desc: "The armed forces seize power, launching a new military dictatorship."
 ARG_dirty_war: "The Dirty War"
 ARG_dirty_war_desc: "The junta wages a brutal campaign against suspected dissidents."
 ARG_operation_condor_argentina: "Join Operation Condor"
 ARG_operation_condor_argentina_desc: "Coordinate repression with other regional military regimes."
 ARG_economic_crisis: "Economic Crisis"
 ARG_economic_crisis_desc: "Inflation and debt cripple the Argentine economy."
 ARG_falklands_tension: "Tension Over the Falklands/Malvinas"
 ARG_falklands_tension_desc: "Rally national sentiment around the long-standing claim to the Falkland Islands."
 ARG_return_to_democracy: "Return to Democracy"
 ARG_return_to_democracy_desc: "Restore civilian rule and free elections after years of military government."
