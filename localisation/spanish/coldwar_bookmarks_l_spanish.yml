 coldwar_bookmark_1945.t: "1945 - El Amanecer de la Guerra Fria"
 coldwar_bookmark_1945.d: "La Segunda Guerra Mundial acaba de terminar. La alianza de guerra entre Estados Unidos y la Union Sovietica ya se resquebraja, y una nueva rivalidad global comienza a tomar forma desde Berlin hasta La Habana."
 coldwar_bookmark_1970.t: "1970 - Revolucion en America Latina"
 coldwar_bookmark_1970.d: "La distension relaja las tensiones entre Washington y Moscu, mientras America Latina se convierte en un nuevo campo de batalla: Cuba exporta la revolucion y Chile esta a punto de elegir al primer presidente marxista democratico de America."
 coldwar_bookmark_1980.t: "1980 - La Decada Perdida"
 coldwar_bookmark_1980.d: "Las dictaduras militares dominan buena parte del Cono Sur, Nicaragua acaba de vivir su propia revolucion, y una nueva ola de confrontacion entre superpotencias asoma en el horizonte."
