l_spanish:
 # Nicaragua
 NIC_coldwar_root: "El Amanecer de la Guerra Fria"
 NIC_coldwar_root_desc: "Mientras el mundo se reordena tras la Segunda Guerra Mundial, la familia Somoza afianza su control sobre Nicaragua."
 NIC_somoza_dynasty: "La Dinastia Somoza"
 NIC_somoza_dynasty_desc: "Consolida el control de la familia Somoza sobre la presidencia y la Guardia Nacional."
 NIC_national_guard_repression: "Represion de la Guardia Nacional"
 NIC_national_guard_repression_desc: "Usa a la Guardia Nacional para reprimir la disidencia politica y el descontento rural."
 NIC_earthquake_corruption: "Terremoto y Corrupcion"
 NIC_earthquake_corruption_desc: "La ayuda para la reconstruccion tras el devastador terremoto de Managua es desviada para enriquecimiento personal, alimentando la ira popular."
 NIC_crush_the_guerrillas: "Aplastar a la Guerrilla"
 NIC_crush_the_guerrillas_desc: "Lanza una campana militar total contra el Frente Sandinista de Liberacion Nacional."
 NIC_continued_repression: "Represion Continuada"
 NIC_continued_repression_desc: "Mantiene un control estricto del pais mediante la fuerza."
 NIC_us_support_somoza: "Asegurar el Apoyo de Estados Unidos"
 NIC_us_support_somoza_desc: "Apoyate en el respaldo de Washington para mantener a flote al regimen."
 NIC_sandinista_revolution_triumphs: "Triunfa la Revolucion Sandinista"
 NIC_sandinista_revolution_triumphs_desc: "La dictadura somocista cae mientras el FSLN entra en Managua."
 NIC_national_reconstruction_junta: "Junta de Gobierno de Reconstruccion Nacional"
 NIC_national_reconstruction_junta_desc: "Establece un nuevo gobierno revolucionario para reconstruir el pais."
 NIC_literacy_campaign: "La Cruzada Nacional de Alfabetizacion"
 NIC_literacy_campaign_desc: "Lanza una campana a nivel nacional para eliminar el analfabetismo."
 NIC_land_reform_nicaragua: "Reforma Agraria"
 NIC_land_reform_nicaragua_desc: "Redistribuye las propiedades de la era somocista entre campesinos y cooperativas."
 NIC_contra_war: "La Guerra de la Contra"
 NIC_contra_war_desc: "Defiende la revolucion frente a las fuerzas contrarrevolucionarias respaldadas por Estados Unidos que operan desde Honduras y Costa Rica."
 NIC_esquipulas_peace: "Los Acuerdos de Paz de Esquipulas"
 NIC_esquipulas_peace_desc: "Sumate a un proceso de paz regional para poner fin al conflicto y normalizar la politica."

 # Brasil
 BRA_coldwar_root: "El Amanecer de la Guerra Fria"
 BRA_coldwar_root_desc: "El Brasil de posguerra entra en un periodo de populismo, inestabilidad y crecientes tensiones de la Guerra Fria."
 BRA_goulart_reforms: "Las Reformas de Base de Goulart"
 BRA_goulart_reforms_desc: "Impulsa la reforma agraria, las nacionalizaciones y la ampliacion del sufragio."
 BRA_military_coup_1964: "El Golpe Militar de 1964"
 BRA_military_coup_1964_desc: "Las fuerzas armadas derrocan al presidente Goulart e instauran un gobierno militar."
 BRA_institutional_act_5: "El Acta Institucional Numero Cinco"
 BRA_institutional_act_5_desc: "Otorga al regimen poderes absolutos, cerrando el Congreso y suspendiendo las libertades civiles."
 BRA_press_censorship: "Censura de Prensa"
 BRA_press_censorship_desc: "Impone una censura estricta sobre periodicos, radio y television."
 BRA_operation_condor_brazil: "Unirse a la Operacion Condor"
 BRA_operation_condor_brazil_desc: "Coordina la represion de disidentes de izquierda con otros regimenes militares de la region."
 BRA_economic_miracle: "El Milagro Economico Brasileno"
 BRA_economic_miracle_desc: "Impulsa un rapido crecimiento industrial y la expansion de infraestructura."
 BRA_amazon_colonization: "Colonizar la Amazonia"
 BRA_amazon_colonization_desc: "Abre la cuenca amazonica a carreteras, colonizacion y extraccion de recursos."
 BRA_nuclear_program_brazil: "Un Programa Nuclear Independiente"
 BRA_nuclear_program_brazil_desc: "Desarrolla tecnologia nuclear al margen de la supervision estadounidense y sovietica."
 BRA_political_opening: "Apertura Politica"
 BRA_political_opening_desc: "Inicia una transicion gradual y controlada para dejar atras el gobierno militar."
 BRA_debt_crisis: "La Crisis de la Deuda"
 BRA_debt_crisis_desc: "Enfrenta una deuda externa desbordada y una inflacion galopante."
 BRA_return_to_democracy: "Retorno a la Democracia"
 BRA_return_to_democracy_desc: "Devuelve el poder a un gobierno civil tras dos decadas de gobierno militar."
