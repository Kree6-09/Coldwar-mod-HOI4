l_spanish:
 # Arbol sovietico
 SOV_coldwar_root: "El Amanecer de la Guerra Fria"
 SOV_coldwar_root_desc: "La Segunda Guerra Mundial ha terminado. Comienza un nuevo conflicto, mas frio, entre la Union Sovietica y las potencias occidentales."
 SOV_warsaw_pact: "Formar el Pacto de Varsovia"
 SOV_warsaw_pact_desc: "Une a los estados socialistas de Europa del Este en una alianza militar formal bajo el liderazgo sovietico."
 SOV_support_dprk: "Apoyar a la RPDC"
 SOV_support_dprk_desc: "Respalda al gobierno de Kim Il-sung en Corea del Norte con armamento y asesores."
 SOV_support_east_germany: "Apoyar a la Republica Democratica Alemana"
 SOV_support_east_germany_desc: "Fortalece el estado socialista en el este de Alemania."
 SOV_berlin_blockade: "El Bloqueo de Berlin"
 SOV_berlin_blockade_desc: "Corta el acceso occidental a Berlin y pon a prueba la determinacion de los Aliados."
 SOV_support_vietnam: "Apoyar al Viet Minh"
 SOV_support_vietnam_desc: "Brinda apoyo material a las fuerzas comunistas en Indochina."
 SOV_afghan_intervention: "Intervenir en Afganistan"
 SOV_afghan_intervention_desc: "Envia al Ejercito Rojo a Afganistan para sostener al gobierno socialista en Kabul."
 SOV_five_year_plan: "Un Nuevo Plan Quinquenal"
 SOV_five_year_plan_desc: "Lanza otro ambicioso plan para modernizar la industria sovietica."
 SOV_heavy_industry: "Priorizar la Industria Pesada"
 SOV_heavy_industry_desc: "Vuelca recursos en la produccion de acero, carbon y maquinaria."
 SOV_collectivization_ii: "Completar la Colectivizacion"
 SOV_collectivization_ii_desc: "Finaliza la colectivizacion de la agricultura sovietica."
 SOV_cuban_alliance: "Abrazar a la Cuba Revolucionaria"
 SOV_cuban_alliance_desc: "Forja lazos estrechos con la Cuba de Castro, a las puertas de Estados Unidos."
 SOV_destalinization: "Desestalinizacion"
 SOV_destalinization_desc: "Denuncia los excesos de la era estalinista y reforma el Partido."
 SOV_detente: "Buscar la Distension"
 SOV_detente_desc: "Busca un periodo de relajacion de tensiones con Occidente."
 SOV_nuclear_program: "El Programa Nuclear Sovietico"
 SOV_nuclear_program_desc: "Corre para alcanzar la capacidad nuclear estadounidense."
 SOV_first_bomb: "Primera Bomba Atomica Sovietica"
 SOV_first_bomb_desc: "Prueba la primera arma nuclear de la URSS, acabando con el monopolio atomico estadounidense."
 SOV_hydrogen_bomb: "La Bomba de Hidrogeno"
 SOV_hydrogen_bomb_desc: "Desarrolla un arma termonuclear mucho mas poderosa que la bomba atomica."
 SOV_missile_program: "Programa de Misiles Balisticos"
 SOV_missile_program_desc: "Desarrolla cohetes capaces de llevar ojivas a traves de continentes."
 SOV_sputnik: "Lanzar el Sputnik"
 SOV_sputnik_desc: "Pon en orbita el primer satelite artificial, sorprendiendo al mundo."
 SOV_space_race_gagarin: "Primer Hombre en el Espacio"
 SOV_space_race_gagarin_desc: "Envia a un cosmonauta sovietico a la orbita antes que los estadounidenses."

 # Arbol estadounidense
 USA_coldwar_root: "El Amanecer de la Guerra Fria"
 USA_coldwar_root_desc: "Con el Eje derrotado, toma forma una nueva rivalidad con la Union Sovietica."
 USA_marshall_plan: "El Plan Marshall"
 USA_marshall_plan_desc: "Financia la reconstruccion de Europa Occidental para mantenerla fuera de la orbita comunista."
 USA_support_western_europe: "Fortalecer Europa Occidental"
 USA_support_western_europe_desc: "Profundiza los lazos economicos y politicos con las democracias de Europa Occidental."
 USA_nato_foundation: "Fundar la OTAN"
 USA_nato_foundation_desc: "Establece un pacto de defensa colectiva contra la expansion sovietica."
 USA_red_scare: "El Temor Rojo"
 USA_red_scare_desc: "Reprime a los sospechosos de simpatizar con el comunismo en el pais."
 USA_containment: "La Politica de Contencion"
 USA_containment_desc: "Adopta una estrategia para contener la expansion del comunismo en el mundo."
 USA_support_south_korea: "Apoyar a Corea del Sur"
 USA_support_south_korea_desc: "Respalda al gobierno de Syngman Rhee frente al Norte comunista."
 USA_korean_war: "Intervenir en Corea"
 USA_korean_war_desc: "Compromete tropas estadounidenses en la defensa de Corea del Sur."
 USA_domino_theory: "La Teoria del Domino"
 USA_domino_theory_desc: "Comprometete a evitar que el Sudeste Asiatico caiga ante el comunismo."
 USA_vietnam_war: "Intervenir en Vietnam"
 USA_vietnam_war_desc: "Envia fuerzas estadounidenses a apoyar a Vietnam del Sur."
 USA_cia_covert_ops: "Expandir la CIA"
 USA_cia_covert_ops_desc: "Amplia las operaciones encubiertas contra los movimientos comunistas en el mundo."
 USA_bay_of_pigs: "Confrontar a Cuba"
 USA_bay_of_pigs_desc: "Intenta socavar al gobierno de Castro a las puertas de Estados Unidos."
 USA_detente: "Buscar la Distension"
 USA_detente_desc: "Busca un periodo de relajacion de tensiones con la Union Sovietica."
 USA_star_wars_sdi: "Iniciativa de Defensa Estrategica"
 USA_star_wars_sdi_desc: "Invierte en un escudo antimisiles para neutralizar la amenaza nuclear sovietica."
 USA_manhattan_legacy: "El Legado del Proyecto Manhattan"
 USA_manhattan_legacy_desc: "Continua el liderazgo estadounidense en la investigacion de armas nucleares."
 USA_hydrogen_bomb: "La Bomba de Hidrogeno"
 USA_hydrogen_bomb_desc: "Desarrolla un arma termonuclear para mantenerse por delante de los sovieticos."
 USA_icbm_program: "Misiles Balisticos Intercontinentales"
 USA_icbm_program_desc: "Desarrolla misiles capaces de golpear directamente a la Union Sovietica."
 USA_apollo_program: "El Programa Apolo"
 USA_apollo_program_desc: "Comprometete con un audaz programa espacial que apunta a la Luna."
 USA_moon_landing: "Llegar a la Luna"
 USA_moon_landing_desc: "Logra la mayor hazana de la Carrera Espacial."
