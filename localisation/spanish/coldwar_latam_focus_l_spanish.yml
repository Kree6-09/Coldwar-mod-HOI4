l_spanish:
 # Cuba
 CUB_revolution_triumphs: "Triunfa la Revolucion"
 CUB_revolution_triumphs_desc: "Las fuerzas de Fidel Castro han derrocado a Batista. Un nuevo gobierno revolucionario toma el poder en La Habana."
 CUB_agrarian_reform: "Reforma Agraria"
 CUB_agrarian_reform_desc: "Redistribuye la tierra de los grandes latifundios entre campesinos y cooperativas."
 CUB_nationalize_industry: "Nacionalizar la Industria"
 CUB_nationalize_industry_desc: "Pon bajo control estatal la industria y las plantaciones de capital extranjero."
 CUB_healthcare_education_campaign: "Campana de Salud y Alfabetizacion"
 CUB_healthcare_education_campaign_desc: "Lanza amplios programas publicos de salud y alfabetizacion."
 CUB_soviet_alignment: "Alinearse con la Union Sovietica"
 CUB_soviet_alignment_desc: "Busca apoyo economico y militar de Moscu."
 CUB_missile_crisis: "La Crisis de los Misiles"
 CUB_missile_crisis_desc: "Los misiles sovieticos en suelo cubano llevan al mundo al borde de la guerra nuclear."
 CUB_export_revolution: "Exportar la Revolucion"
 CUB_export_revolution_desc: "Apoya a los movimientos revolucionarios en toda America Latina."
 CUB_support_sandinistas: "Apoyar a los Sandinistas"
 CUB_support_sandinistas_desc: "Ayuda al nuevo gobierno revolucionario de Nicaragua."
 CUB_bay_of_pigs_defense: "Defenderse de la Invasion"
 CUB_bay_of_pigs_defense_desc: "Prepara las defensas de la isla ante un desembarco respaldado por Estados Unidos."
 CUB_militarize_population: "Militarizar a la Poblacion"
 CUB_militarize_population_desc: "Arma y entrena milicias civiles para defender la revolucion."
 CUB_soviet_military_aid: "Ayuda Militar Sovietica"
 CUB_soviet_military_aid_desc: "Recibe armamento y asesores de la Union Sovietica."

 # Chile
 CHL_coldwar_root: "El Amanecer de la Guerra Fria"
 CHL_coldwar_root_desc: "Mientras el mundo se reordena tras la Segunda Guerra Mundial, la politica chilena entra en una nueva era de polarizacion."
 CHL_popular_unity_formed: "Coalicion de la Unidad Popular"
 CHL_popular_unity_formed_desc: "Una coalicion de partidos socialistas y de izquierda se forma en torno a Salvador Allende."
 CHL_allende_elected: "Allende Elegido Presidente"
 CHL_allende_elected_desc: "Salvador Allende gana la presidencia, convirtiendose en el primer jefe de Estado marxista elegido democraticamente en America."
 CHL_nationalize_copper: "Nacionalizar el Cobre"
 CHL_nationalize_copper_desc: "Pon bajo propiedad estatal las minas de cobre, vitales para Chile."
 CHL_deepen_socialism: "Profundizar la Via Socialista"
 CHL_deepen_socialism_desc: "Continua con el programa de la Unidad Popular pese a la creciente oposicion."
 CHL_land_reform_completion: "Completar la Reforma Agraria"
 CHL_land_reform_completion_desc: "Finaliza la redistribucion de los grandes latifundios entre los campesinos."
 CHL_socialist_consolidation: "Consolidar la Via Chilena al Socialismo"
 CHL_socialist_consolidation_desc: "Estabiliza las instituciones del pais en torno al proyecto de la Unidad Popular."
 CHL_military_coup: "Golpe Militar"
 CHL_military_coup_desc: "Las fuerzas armadas derrocan al gobierno e instalan una junta militar."
 CHL_dina_repression: "Represion Estatal"
 CHL_dina_repression_desc: "El nuevo regimen reprime duramente a la oposicion politica."
 CHL_chicago_boys_reforms: "Las Reformas de los Chicago Boys"
 CHL_chicago_boys_reforms_desc: "Implementa amplias reformas economicas de libre mercado."
 CHL_operation_condor_chile: "Unirse a la Operacion Condor"
 CHL_operation_condor_chile_desc: "Coopera con otros regimenes de la region contra los disidentes de izquierda."

 # Argentina
 ARG_coldwar_root: "El Amanecer de la Guerra Fria"
 ARG_coldwar_root_desc: "La Argentina de posguerra enfrenta profundas divisiones politicas que marcaran su era de Guerra Fria."
 ARG_peronist_legacy: "El Legado Peronista"
 ARG_peronist_legacy_desc: "Navega la influencia duradera del peronismo en la politica argentina."
 ARG_political_instability: "Inestabilidad Politica"
 ARG_political_instability_desc: "Un ciclo de golpes y gobiernos civiles debiles desestabiliza al pais."
 ARG_proceso_coup: "El Proceso de Reorganizacion Nacional"
 ARG_proceso_coup_desc: "Las fuerzas armadas toman el poder e instauran una nueva dictadura militar."
 ARG_dirty_war: "La Guerra Sucia"
 ARG_dirty_war_desc: "La junta libra una brutal campana contra los sospechosos de disidencia."
 ARG_operation_condor_argentina: "Unirse a la Operacion Condor"
 ARG_operation_condor_argentina_desc: "Coordina la represion con otros regimenes militares de la region."
 ARG_economic_crisis: "Crisis Economica"
 ARG_economic_crisis_desc: "La inflacion y la deuda paralizan la economia argentina."
 ARG_falklands_tension: "Tension por las Malvinas"
 ARG_falklands_tension_desc: "Moviliza el sentimiento nacional en torno al reclamo historico sobre las Islas Malvinas."
 ARG_return_to_democracy: "Retorno a la Democracia"
 ARG_return_to_democracy_desc: "Restaura el gobierno civil y las elecciones libres tras anos de gobierno militar."
