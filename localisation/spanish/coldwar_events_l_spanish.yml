l_spanish:
 coldwar_flavor.1.t: "El Bloqueo de Berlin"
 coldwar_flavor.1.d: "Las fuerzas sovieticas han cortado todo acceso terrestre y ferroviario a Berlin Occidental. Los Aliados occidentales deben decidir como responder a esta prueba de voluntades."
 coldwar_flavor.1.a: "Mantenerse firmes"
 coldwar_flavor.1.b: "Buscar un acuerdo negociado"

 coldwar_flavor.2.t: "Reaccion al Plan Marshall"
 coldwar_flavor.2.d: "Miles de millones de dolares en ayuda fluyen hacia Europa Occidental. El plan ya esta transformando la politica y la economia del continente."
 coldwar_flavor.2.a: "Publicitar el exito del plan"
 coldwar_flavor.2.b: "Mantener un perfil discreto"

 coldwar_flavor.3.t: "Primer Relampago"
 coldwar_flavor.3.d: "En las estepas de Kazajistan, la Union Sovietica ha probado con exito su primer dispositivo atomico, acabando con el monopolio nuclear estadounidense."
 coldwar_flavor.3.a: "Celebrar este logro historico"

 coldwar_flavor.4.t: "Trece Dias"
 coldwar_flavor.4.d: "El reconocimiento aereo estadounidense ha detectado instalaciones de misiles sovieticos en suelo cubano. El mundo contiene la respiracion mientras ambas superpotencias estan al borde de la guerra nuclear."
 coldwar_flavor.4.a: "Mantenerse firmes junto a Moscu"
 coldwar_flavor.4.b: "Apoyar una retirada negociada"

 coldwar_flavor.5.t: "El Bombardeo de La Moneda"
 coldwar_flavor.5.d: "Aviones de la Fuerza Aerea chilena han bombardeado el palacio presidencial. Las fuerzas armadas han tomado el poder, poniendo fin a decadas de tradicion democratica."
 coldwar_flavor.5.a: "La junta consolida el control"

 coldwar_flavor.6.t: "La Disputa del Atlantico Sur"
 coldwar_flavor.6.d: "Decadas de frustracion diplomatica por las Islas Malvinas han puesto sobre la mesa la posibilidad de un conflicto armado con Gran Bretana."
 coldwar_flavor.6.a: "Preparar a las fuerzas armadas"
 coldwar_flavor.6.b: "Seguir buscando una solucion diplomatica"

 coldwar_flavor.7.t: "Cae Managua"
 coldwar_flavor.7.d: "Los combatientes sandinistas han entrado en Managua mientras los ultimos miembros del regimen somocista huyen del pais. Decadas de gobierno dinastico llegan a su fin."
 coldwar_flavor.7.a: "Comenzar a construir el nuevo Estado revolucionario"

 coldwar_flavor.8.t: "Tanques en Brasilia"
 coldwar_flavor.8.d: "Las fuerzas armadas se han movilizado contra el presidente Goulart, quien ha huido al exilio. Un gobierno militar controla ahora el pais."
 coldwar_flavor.8.a: "Las fuerzas armadas toman el control"
